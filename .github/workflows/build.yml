name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Put files into Android folders
        run: |
          J=app/src/main/java/com/aditya/wakey
          R=app/src/main/res
          if [ ! -d app/src ]; then
            mkdir -p $J $R/values $R/drawable $R/mipmap-anydpi-v26
            mv *.kt $J/
            mv AndroidManifest.xml app/src/main/
            mv themes.xml $R/values/
            mv ic_launcher_foreground.xml ic_stat_alarm.xml $R/drawable/
            mv ic_launcher.xml $R/mipmap-anydpi-v26/
            mv wakey.keystore app/
          fi
          rm -f *.ttf
          mkdir -p $R/font
          curl -sSL -o inter.zip https://github.com/rsms/inter/releases/download/v4.0/Inter-4.0.zip
          unzip -oq inter.zip "extras/ttf/Inter-Regular.ttf" "extras/ttf/Inter-Medium.ttf" "extras/ttf/Inter-SemiBold.ttf" "extras/ttf/Inter-Bold.ttf" "extras/ttf/InterDisplay-Bold.ttf" -d inter
          cp inter/extras/ttf/Inter-Regular.ttf $R/font/inter_regular.ttf
          cp inter/extras/ttf/Inter-Medium.ttf $R/font/inter_medium.ttf
          cp inter/extras/ttf/Inter-SemiBold.ttf $R/font/inter_semibold.ttf
          cp inter/extras/ttf/Inter-Bold.ttf $R/font/inter_bold.ttf
          cp inter/extras/ttf/InterDisplay-Bold.ttf $R/font/inter_display_bold.ttf
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }
          val buildNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInt()
          android {
              namespace = "com.aditya.wakey"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.aditya.wakey"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = buildNumber
                  versionName = "1.0.$buildNumber"
              }
              signingConfigs {
                  create("wakey") {
                      storeFile = file("wakey.keystore")
                      storePassword = "wakey123"
                      keyAlias = "wakey"
                      keyPassword = "wakey123"
                  }
              }
              buildTypes {
                  debug { signingConfig = signingConfigs.getByName("wakey") }
                  release {
                      isMinifyEnabled = true
                      isShrinkResources = true
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                      signingConfig = signingConfigs.getByName("wakey")
                  }
              }
              lint {
                  checkReleaseBuilds = false
                  abortOnError = false
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
          }
          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.09.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-core")
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.activity:activity-compose:1.9.2")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.6")
              implementation("androidx.lifecycle:lifecycle-runtime-compose:2.8.6")
              implementation("androidx.camera:camera-core:1.3.4")
              implementation("androidx.camera:camera-camera2:1.3.4")
              implementation("androidx.camera:camera-lifecycle:1.3.4")
              implementation("androidx.camera:camera-view:1.3.4")
              implementation("com.google.mlkit:barcode-scanning:17.3.0")
          }
          EOF
          cat > app/proguard-rules.pro <<'EOF'
          -dontwarn com.google.errorprone.annotations.**
          -dontwarn javax.annotation.**
          -dontwarn org.checkerframework.**
          -dontwarn com.google.j2objc.annotations.**
          -dontwarn afu.org.checkerframework.**
          -dontwarn org.jetbrains.annotations.**
          -keep class com.aditya.wakey.** { *; }
          EOF
          find app -type f | sort

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon 2>&1 | tee build.log

      - name: Show compile errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong" -A3 build.log | head -60 | sed 's/^/::error::/' || true

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Wakey.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Wakey-apk
          path: Wakey.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Wakey build ${{ github.run_number }}
          files: Wakey.apk
          make_latest: true
