name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Put files into Android folders
        run: |
          if [ ! -d app/src ]; then
            J=app/src/main/java/com/aditya/wakey
            R=app/src/main/res
            mkdir -p $J $R/values $R/drawable $R/mipmap-anydpi-v26
            mv *.kt $J/
            mv AndroidManifest.xml app/src/main/
            mv themes.xml $R/values/
            mv ic_launcher_foreground.xml ic_stat_alarm.xml $R/drawable/
            mv ic_launcher.xml $R/mipmap-anydpi-v26/
            mv wakey.keystore app/
          fi
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }
          val buildNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInt()
          android {
              namespace = "com.aditya.wakey"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.aditya.wakey"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = buildNumber
                  versionName = "1.0.$buildNumber"
              }
              signingConfigs {
                  create("wakey") {
                      storeFile = file("wakey.keystore")
                      storePassword = "wakey123"
                      keyAlias = "wakey"
                      keyPassword = "wakey123"
                  }
              }
              buildTypes {
                  debug { signingConfig = signingConfigs.getByName("wakey") }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
          }
          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.09.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-core")
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.activity:activity-compose:1.9.2")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.6")
              implementation("androidx.lifecycle:lifecycle-runtime-compose:2.8.6")
              implementation("androidx.camera:camera-core:1.3.4")
              implementation("androidx.camera:camera-camera2:1.3.4")
              implementation("androidx.camera:camera-lifecycle:1.3.4")
              implementation("androidx.camera:camera-view:1.3.4")
              implementation("com.google.mlkit:barcode-scanning:17.3.0")
          }
          EOF
          echo "--- layout ---"; find app -type f | sort

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build.log

      - name: Show compile errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong" -A3 build.log | head -60 | sed 's/^/::error::/' || true

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Wakey.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Wakey-apk
          path: Wakey.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Wakey build ${{ github.run_number }}
          files: Wakey.apk
          make_latest: true
